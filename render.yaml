# Deploy from New > Blueprint. Credentials are entered in Render, never here.
services:
  - type: web
    name: letsgym-api
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    # Free instances have no pre-deploy command. The migration runner uses a
    # transaction, an advisory lock, and a migration ledger before API startup.
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: PASSWORD_RESET_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: apps-script
      - key: APPS_SCRIPT_URL
        sync: false
      - key: APPS_SCRIPT_SECRET
        sync: false
